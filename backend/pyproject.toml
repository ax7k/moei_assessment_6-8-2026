description = "MOEI HR Companion - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "copilotkit>=0.1.5",
    "langgraph>=0.2.28",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.40.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "PyPDF2>=3.0.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4.0",
]
